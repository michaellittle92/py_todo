<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todos</title>
    <link rel="stylesheet" href="todo.css">
</head>

<body>
    <h1>Todo List</h1>
    <h2>Create Todo</h2>
    <form id="createTodoForm">
        <label>
            Title
            <input id="newTitle" required />
        </label>

        <label>
            Description
            <input id="newDescription" />
        </label>

        <label>
            Priority
            <input id="newPriority" type="number" min="1" max="5" value="1" required />
        </label>

        <label>
            Complete
            <input id="newComplete" type="checkbox" />
        </label>

        <button type="submit">Create</button>
    </form>

    <button id="logoutBtn" type="button">Logout</button>

    <p id="error"></p>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>Priority</th>
                <th>Complete</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="todoBody">
            <!-- rows will be inserted here -->
        </tbody>
    </table>



    <script src="./todos.js"></script>
</body>

</html>
